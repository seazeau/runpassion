name: Deploy RunPassion to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy static site to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SEO HTML pages for all articles
        run: python3 generate_seo_pages.py

      - name: Deploy to Hostinger via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:timeout 20;
            mirror --reverse --delete --no-perms --parallel=2 \
              --exclude '^\.git' \
              --exclude '^\.github' \
              --exclude '^\.gitignore$' \
              --exclude '^wp-content/' \
              --exclude '^insta_carousel/' \
              --exclude '^\.ftp-deploy-sync-state' \
              --exclude '^save_article\.php$' \
              --exclude '^__pycache__/' \
              --exclude '\.py$' \
              --exclude '\.bat$' \
              ./ ./ ;
            quit
          "
