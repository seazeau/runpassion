<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Console d'Écriture | RunPassion</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Quill WYSIWYG Editor Theme -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.0/dist/quill.snow.css" rel="stylesheet" />

    <style>
        :root {
            --bg-dark: #07070a;
            --card-dark: #0f1016;
            --border-dark: #1f212e;
            --accent-yellow: #fcb900;
            --accent-yellow-hover: #e0a500;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header design */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 2.5rem;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: -0.05em;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        h1 span {
            color: var(--accent-yellow);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Glassmorphism Card style */
        .editor-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-yellow);
        }

        input[type="text"],
        input[type="date"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-dark);
            border-radius: 0.75rem;
            padding: 0.85rem 1.2rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-yellow);
            background-color: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(252, 185, 0, 0.15);
        }

        /* Slug indicator */
        .slug-preview {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            font-family: monospace;
        }

        /* Quill Editor Styling */
        .ql-toolbar.ql-snow {
            border-color: var(--border-dark) !important;
            border-top-left-radius: 0.75rem;
            border-top-right-radius: 0.75rem;
            background-color: rgba(255, 255, 255, 0.02);
        }

        .ql-container.ql-snow {
            border-color: var(--border-dark) !important;
            border-bottom-left-radius: 0.75rem;
            border-bottom-right-radius: 0.75rem;
            background-color: rgba(255, 255, 255, 0.01);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1rem;
            min-height: 350px;
        }

        .ql-editor {
            color: var(--text-main);
            line-height: 1.6;
        }

        .ql-editor.ql-blank::before {
            color: #6b7280 !important;
            font-style: normal;
        }

        /* Button Publish */
        .btn-publish {
            background-color: var(--accent-yellow);
            color: #000;
            border: none;
            border-radius: 0.75rem;
            padding: 1rem 2rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            font-style: italic;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 1rem;
        }

        .btn-publish:hover {
            background-color: var(--accent-yellow-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(252, 185, 0, 0.3);
        }

        .btn-publish:active {
            transform: translateY(0);
        }

        .btn-publish:disabled {
            background-color: var(--border-dark);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Feedback Alerts */
        .alert {
            border-radius: 0.75rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: none;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .spinner {
            display: none;
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Load wordpressArticles to determine Next ID -->
    <script src="articles_data.js"></script>

    <div class="container">
        <header>
            <h1>Console de Publication <span>RunPassion</span></h1>
            <p class="subtitle">Rédigez, optimisez votre SEO et publiez directement en ligne sur Hostinger</p>
        </header>

        <div class="editor-card">
            <!-- Feedback panels -->
            <div id="alert-success" class="alert alert-success">
                <i class="bi bi-check-circle-fill"></i>
                <span id="success-text">Article publié en ligne et Sitemap XML mis à jour !</span>
            </div>
            
            <div id="alert-error" class="alert alert-error">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span id="error-text">Erreur lors de la publication.</span>
            </div>

            <form id="article-form" onsubmit="publishArticle(event)">
                <div class="form-row">
                    <!-- Title -->
                    <div class="form-group">
                        <label for="title">Titre de l'article (H1)</label>
                        <input type="text" id="title" required placeholder="ex: Test Brooks Adrénaline GTS 25" oninput="updateSlug()">
                        <div class="slug-preview">Slug généré : <span id="slug-preview-text">...</span></div>
                    </div>

                    <!-- Category -->
                    <div class="form-group">
                        <label for="category">Catégorie</label>
                        <select id="category">
                            <option value="Matériel">Matériel (Tests chaussures)</option>
                            <option value="Actualités">Actualités</option>
                            <option value="Conseils">Conseils</option>
                            <option value="Guides">Guides</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <!-- Author -->
                    <div class="form-group">
                        <label for="author">Auteur</label>
                        <input type="text" id="author" value="Vincent" required>
                    </div>

                    <!-- Date -->
                    <div class="form-group">
                        <label for="date">Date de publication</label>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <div class="form-row">
                    <!-- Main Image Link -->
                    <div class="form-group">
                        <label for="image">Image principale (Chemin local ou URL)</label>
                        <input type="text" id="image" required placeholder="ex: images/nom-image.webp">
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Mot de passe de publication</label>
                        <input type="password" id="password" required placeholder="Entrez le mot de passe Hostinger">
                    </div>
                </div>

                <!-- Excerpt (SEO Description) -->
                <div class="form-group full-width">
                    <label for="excerpt">Extrait court / Description SEO (pour les cartes et moteurs)</label>
                    <textarea id="excerpt" rows="2" required placeholder="Un court paragraphe accrocheur résumant votre article..."></textarea>
                </div>

                <!-- Quill Content Editor -->
                <div class="form-group full-width">
                    <label>Contenu de l'article</label>
                    <div id="editor-container"></div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btn-submit" class="btn-publish">
                    <span id="btn-text"><i class="bi bi-send-fill"></i> Publier l'article</span>
                    <div id="btn-spinner" class="spinner"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- Quill Editor JS library -->
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.0/dist/quill.js"></script>

    <script>
        // Set date input to today
        document.getElementById('date').value = new Date().toISOString().substring(0, 10);

        // Initialize Quill WYSIWYG Editor
        const quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'Rédigez le contenu complet de votre article ici...',
            modules: {
                toolbar: [
                    [{ 'header': [2, 3, false] }],
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'image', 'clean']
                ]
            }
        });

        // Handler d'image personnalisé pour éviter d'insérer du Base64 lourd
        const toolbar = quill.getModule('toolbar');
        toolbar.addHandler('image', () => {
            const range = quill.getSelection();
            const value = prompt("Entrez le chemin ou l'URL de l'image (ex: images/adrenaline-side.webp) :");
            if (value) {
                quill.insertEmbed(range.index, 'image', value.trim(), Quill.sources.USER);
            }
        });

        // Auto Slug generation function
        function createSlug(title) {
            return title
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "") // Remove accents
                .replace(/[^a-z0-9]+/g, "-")    // Replace spaces/special chars with hyphens
                .replace(/(^-|-$)+/g, "")       // Remove leading/trailing hyphens
                .replace(/^test-/, "");         // Remove redundant prefix
        }

        function updateSlug() {
            const titleVal = document.getElementById('title').value;
            document.getElementById('slug-preview-text').textContent = createSlug(titleVal) || "...";
        }

        // Publish Function
        async function publishArticle(event) {
            event.preventDefault();

            // Clear alerts
            document.getElementById('alert-success').style.display = 'none';
            document.getElementById('alert-error').style.display = 'none';

            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const author = document.getElementById('author').value.trim();
            const date = document.getElementById('date').value;
            const image = document.getElementById('image').value.trim();
            const excerpt = document.getElementById('excerpt').value.trim();
            const password = document.getElementById('password').value;
            
            // Get HTML from Quill editor
            const contentHtml = quill.getSemanticHTML(); 

            if (!contentHtml.replace(/<[^>]*>/g, '').trim()) {
                showError("Veuillez rédiger du contenu pour l'article.");
                return;
            }

            // Calculate next sequential ID
            let nextId = 1;
            if (typeof wordpressArticles !== 'undefined' && wordpressArticles.length > 0) {
                const maxId = Math.max(...wordpressArticles.map(a => a.id || 0));
                nextId = maxId + 1;
            }

            const article = {
                id: nextId,
                title: title,
                slug: createSlug(title),
                category: category,
                author: author,
                date: date,
                image: image,
                excerpt: excerpt,
                content: contentHtml
            };

            // UI loading state
            setLoading(true);

            try {
                const response = await fetch('save_article.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        password: password,
                        article: article
                    })
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    showSuccess("L'article a été publié en ligne avec succès ! Le sitemap XML a également été mis à jour.");
                    // Reset form fields but keep password/author
                    document.getElementById('title').value = '';
                    document.getElementById('image').value = '';
                    document.getElementById('excerpt').value = '';
                    quill.setText('');
                    updateSlug();
                } else {
                    showError(result.message || "Une erreur est survenue lors de l'enregistrement.");
                }
            } catch (err) {
                showError("Impossible de contacter le serveur. Assurez-vous d'avoir envoyé ecrire.html et save_article.php sur votre serveur Hostinger.");
            } finally {
                setLoading(false);
            }
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('btn-submit');
            const spinner = document.getElementById('btn-spinner');
            const text = document.getElementById('btn-text');

            if (isLoading) {
                btn.disabled = true;
                spinner.style.display = 'block';
                text.style.display = 'none';
            } else {
                btn.disabled = false;
                spinner.style.display = 'none';
                text.style.display = 'block';
            }
        }

        function showSuccess(msg) {
            const alert = document.getElementById('alert-success');
            document.getElementById('success-text').textContent = msg;
            alert.style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showError(msg) {
            const alert = document.getElementById('alert-error');
            document.getElementById('error-text').textContent = msg;
            alert.style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
