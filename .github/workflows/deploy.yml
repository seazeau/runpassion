name: Build & Deploy RunPassion to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Next.js & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export (out/)
        run: npm run build

      - name: Deploy out/ to Hostinger via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 3;
            mirror --reverse --delete --parallel=4 \
              --exclude '^images/' \
              --exclude '^wp-content/' \
              --exclude '^\.git' \
              --exclude '^\.ftp-deploy-sync-state' \
              ./out/ ./ ;
            quit
          "
