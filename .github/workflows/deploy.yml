name: Deploy RunPassion to Hostinger

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1' # Tous les lundis à 06h00 UTC (07h/08h heure de Paris)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy static site to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update weekly Top4Running Bons Plans
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          python3 update_bons_plans.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/deal-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "chore(bons-plans): mise à jour hebdomadaire automatique Top4Running"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Generate SEO HTML pages for all articles
        run: python3 generate_seo_pages.py

      - name: Deploy to Hostinger via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:timeout 20;
            mirror --reverse --delete --no-perms --ignore-time --parallel=8 \
              ./images ./images ;
            mirror --reverse --delete --no-perms --ignore-time --parallel=8 \
              --exclude '^\.git' \
              --exclude '^\.github' \
              --exclude '^\.gitignore$' \
              --exclude '^wp-content/' \
              --exclude '^insta_carousel/' \
              --exclude '^\.ftp-deploy-sync-state' \
              --exclude '^save_article\.php$' \
              --exclude '^__pycache__/' \
              --exclude '\.py$' \
              --exclude '\.bat$' \
              ./ ./ ;
            quit
          "
